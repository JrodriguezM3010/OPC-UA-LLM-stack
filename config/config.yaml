opcua:
  url: "${OPCUA_URL}"
  user: "${OPCUA_USER}"
  password: "${OPCUA_PASSWORD}"

postgres:
  user: "${POSTGRES_USER}"
  password: "${POSTGRES_PASSWORD}"
  host: "${POSTGRES_HOST}"
  port: "${POSTGRES_PORT}"
  db: "${POSTGRES_DB}"
  table: "Tank_Simulator"

table:
  name: "Tank Simulator"
  target_id: 1

sync:
  interval_seconds: 1
  source_field: "source"
  timestamp_field: "updated_at"

mapping:
  opc_to_db:
    pump_speed: "Pump_Speed(%)"
    pump_running: "Pump_running"
    level: "Level"
    alarm: "Alarm"
    outlet_valve: "Outlet_Valve(%)"

  commands_to_db:
    OutletValve_SP: "OutletValve_SP"
    TankLevel_SP: "TankLevel_SP"
    RemoteStart: "RemoteStart"
