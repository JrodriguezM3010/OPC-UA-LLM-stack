# Host-network variant of compose.yaml, for devices whose firewall blocks Docker's published ports.
#
# The services reached from outside bind the host directly, so they answer on
# every interface the host has.
#
# Required in .env:
#   vPLC_Runtime, OPCUA_URL, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#
# Optional in .env:
#   OPENAI_API_KEY    only for the GPT workflow; without it use Ollama
#   OPCUA_USER        empty means an anonymous connection
#   OPCUA_PASSWORD
#   GENERIC_TIMEZONE

name: otee-tank-ai

services:
  gateway:
    image: juanotee/tank-ai-gateway:0.0.1
    environment:
      vPLC_Runtime: ${vPLC_Runtime:?vPLC_Runtime must be set}
      OPCUA_URL: ${OPCUA_URL:-opc.tcp://host.docker.internal:4840}
      OPCUA_USER: ${OPCUA_USER:-}
      OPCUA_PASSWORD: ${OPCUA_PASSWORD:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  db:
    image: juanotee/tank-ai-db:0.0.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  n8n:
    image: juanotee/tank-ai-n8n:0.0.1
    network_mode: host
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_GRANT_TOKEN_TTL: "300"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      NODE_ENV: production
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      DB_SQLITE_POOL_SIZE: "4"
      DB_SQLITE_VACUUM_ON_STARTUP: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Oslo}
      TZ: ${GENERIC_TIMEZONE:-Europe/Oslo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      OLLAMA_URL: http://127.0.0.1:11434
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  chat-ui:
    image: juanotee/tank-ai-chatui:0.0.1
    network_mode: host
    environment:
      CHAT_UI_PORT: ${CHAT_UI_PORT:-8083}
      N8N_UPSTREAM: http://127.0.0.1:5678
    depends_on:
      - n8n
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  ollama:
    image: juanotee/tank-ai-ollama:0.0.1
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  db-data:
  n8n-data:
  ollama-data:
