services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: gateway
    environment:
      vPLC_Runtime: ${vPLC_Runtime}
      OPCUA_URL: ${OPCUA_URL:-opc.tcp://host.docker.internal:4840}
      OPCUA_USER: ${OPCUA_USER:-}
      OPCUA_PASSWORD: ${OPCUA_PASSWORD:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - db
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
  db:
    image: postgres:16.15-alpine
    container_name: tank-simulator-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
  adminer:
    image: adminer:6.0.1
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db
    profiles:
      - development
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
  n8n:
    image: n8nio/n8n:2.35.7
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:${N8N_PORT:-5678}"
    entrypoint: ["/bin/sh", "/files/init.sh"]
    environment:
      # Basic Configuration
      - N8N_HOST=0.0.0.0
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_GRANT_TOKEN_TTL=300
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - NODE_ENV=production
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - DB_SQLITE_POOL_SIZE=4
      - DB_SQLITE_VACUUM_ON_STARTUP=true
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      
      # Timezone
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}

      # OpenAI API Key
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Postgres DB Connection
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

      # Ollama connection used by the imported credential
      - OLLAMA_URL=http://ollama:11434

    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/files
    depends_on:
      - db
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  chat-ui:
    image: nginx:1.31.4-alpine
    container_name: chat-ui
    restart: unless-stopped
    environment:
      CHAT_UI_PORT: ${CHAT_UI_PORT:-8083}
      N8N_UPSTREAM: http://n8n:5678
    ports:
      - "${CHAT_UI_PORT:-8083}:${CHAT_UI_PORT:-8083}"
    volumes:
      - ./chat-ui:/usr/share/nginx/html:ro
      - ./chat-ui/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - n8n
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  ollama:
    image: ollama/ollama:0.32.15
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    entrypoint: ["/bin/bash", "/start-ollama.sh"]
    volumes:
      - ./ollama/start-ollama.sh:/start-ollama.sh
      - ollama_data:/root/.ollama
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
      
volumes:
  db_data:
  n8n_data:
  ollama_data:
